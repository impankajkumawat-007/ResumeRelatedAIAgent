<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Pankaj Kumawat — Chat</title>
    <style>
      :root {
        font-family: system-ui, -apple-system, sans-serif;
        color: #1a1a1a;
        --user: #fff7ed;
        --bot: #f4f4f5;
        --accent: #d97706;
      }
      body {
        margin: 0;
        min-height: 100dvh;
        display: flex;
        flex-direction: column;
        background: #fafafa;
      }
      header {
        padding: 1rem 1.25rem;
        border-bottom: 1px solid #e4e4e7;
        background: #fff;
      }
      header h1 {
        margin: 0;
        font-size: 1.15rem;
      }
      header p {
        margin: 0.35rem 0 0;
        color: #71717a;
        font-size: 0.9rem;
      }
      #log {
        flex: 1;
        overflow-y: auto;
        padding: 1rem 1.25rem;
        display: flex;
        flex-direction: column;
        gap: 0.75rem;
      }
      .bubble {
        max-width: 42rem;
        padding: 0.75rem 1rem;
        border-radius: 12px;
        line-height: 1.5;
        white-space: pre-wrap;
        word-break: break-word;
      }
      .user {
        align-self: flex-end;
        background: var(--user);
        border: 1px solid #fed7aa;
      }
      .assistant {
        align-self: flex-start;
        background: var(--bot);
        border: 1px solid #e4e4e7;
      }
      form {
        display: flex;
        gap: 0.5rem;
        padding: 1rem 1.25rem;
        border-top: 1px solid #e4e4e7;
        background: #fff;
      }
      input[type="text"] {
        flex: 1;
        padding: 0.65rem 0.85rem;
        border: 1px solid #d4d4d8;
        border-radius: 10px;
        font-size: 1rem;
      }
      button {
        padding: 0.65rem 1.1rem;
        background: var(--accent);
        color: #fff;
        border: none;
        border-radius: 10px;
        font-weight: 600;
        cursor: pointer;
      }
      button:disabled {
        opacity: 0.55;
        cursor: not-allowed;
      }
    </style>
  </head>
  <body>
    <header>
      <h1>Pankaj Kumawat</h1>
      <p>Ask about my work, book a call, or talk hiring — the agent can take real actions.</p>
    </header>
    <div id="log" aria-live="polite"></div>
    <form id="form">
      <input type="text" id="input" placeholder="Type a message…" autocomplete="off" required />
      <button type="submit" id="send">Send</button>
    </form>
    <script>
      const log = document.getElementById("log");
      const form = document.getElementById("form");
      const input = document.getElementById("input");
      const send = document.getElementById("send");

      function addBubble(role, text) {
        const el = document.createElement("div");
        el.className = `bubble ${role}`;
        el.textContent = text;
        log.appendChild(el);
        log.scrollTop = log.scrollHeight;
        return el;
      }

      form.addEventListener("submit", async (e) => {
        e.preventDefault();
        const message = input.value.trim();
        if (!message) return;
        input.value = "";
        send.disabled = true;
        addBubble("user", message);
        const bot = addBubble("assistant", "…");

        try {
          const res = await fetch("/api/chat", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ message }),
          });
          if (!res.ok) {
            bot.textContent = "Sorry — server error " + res.status;
            return;
          }
          const reader = res.body.getReader();
          const dec = new TextDecoder();
          let buf = "";
          while (true) {
            const { done, value } = await reader.read();
            if (done) break;
            buf += dec.decode(value, { stream: true });
            const parts = buf.split("\n\n");
            buf = parts.pop() || "";
            for (const part of parts) {
              const line = part.split("\n").find((l) => l.startsWith("data: "));
              if (!line) continue;
              const data = JSON.parse(line.slice(6));
              if (data.text) bot.textContent = data.text;
            }
          }
        } catch (err) {
          bot.textContent = "Network error — try again.";
          console.error(err);
        } finally {
          send.disabled = false;
          input.focus();
        }
      });
    </script>
  </body>
</html>
